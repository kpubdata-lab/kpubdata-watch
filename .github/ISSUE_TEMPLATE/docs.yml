name: 문서 개선
description: 문서 오류, 누락, 개선 사항을 신고합니다
title: "docs: "
body:
  - type: input
    id: location
    attributes:
      label: 문서 위치
      description: 파일 경로 또는 URL
      placeholder: "예) docs/DOMAIN_MODEL.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제 / 개선 제안
      description: 무엇이 부정확하거나 부족한가요? 어떻게 바뀌면 좋을까요?
    validations:
      required: true
  - type: dropdown
    id: verification
    attributes:
      label: Required Verification (POLICY 18)
      description: |
        이 문서 이슈가 완료되었다고 판단하려면 어떤 기계 검증이 필요한가요?
        문서 대부분은 정적 검사(V0, 링크·빌드·lint)로 충분합니다.
      options:
        - Static checks (V0) — lint, typecheck, schema validation
        - Unit tests (V1)
        - Replay and contract tests (V2) — fixture-based
        - Component integration tests (V3)
        - Live provider API calls (V4) — real provider API calls
        - Product end-to-end, replay (V5-replay)
        - Product end-to-end, live (V5-live)
    validations:
      required: true
